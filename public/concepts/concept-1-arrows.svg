  <path d="M238 158 L274 142 L398 422 L362 438 Z" fill="url(#gradOut)"/>
  <path d="M380 470 L356 430 L404 430 Z" fill="url(#gradOut)"/>
  <rect x="185" y="286" width="142" height="28" rx="14" fill="#22D3EE"/>
