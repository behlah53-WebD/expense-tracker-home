<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0F2A"/>
      <stop offset="100%" stop-color="#070A1A"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <ellipse cx="256" cy="150" rx="190" ry="100" fill="#4F46E5" opacity="0.18" filter="url(#glow)"/>
  <path d="M150 420 Q150 140 256 180 Q362 140 362 420 L340 420 Q340 160 256 200 Q172 160 172 420 Z" fill="url(#ribbon)"/>
  <path d="M256 180 L256 200" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.35" filter="url(#soft)"/>
  <path d="M150 420 L172 420 M362 420 L340 420" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
</svg>
